name: Сборка corepanel

# Запуск вручную: вкладка Actions → «Сборка corepanel» → Run workflow
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия (например 0.1.2)"
        required: true
        default: "0.1.80"
      release:
        description: "Создать GitHub Release с файлами"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Проверка (vet и тесты)
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Сборка бинарников (8 архитектур)
        run: scripts/build.sh "${{ inputs.version }}"

      - name: Сборка пакетов .ipk (OpenWrt и Entware)
        run: scripts/mkipk.sh "${{ inputs.version }}"

      - name: Подготовка файлов и контрольные суммы
        run: |
          mkdir -p out
          cp dist/corepanel-linux-* out/
          cp dist/ipk/*.ipk out/
          cd out && sha256sum * > SHA256SUMS.txt && ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: corepanel-${{ inputs.version }}
          path: out/*
          retention-days: 30

      - name: GitHub Release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ inputs.version }}"
          notes="Бинарники: corepanel-linux-<arch>. Пакеты: corepanel_<версия>_<arch>_<openwrt|entware>.ipk. Какой выбрать — в README."
          if gh release view "$tag" >/dev/null 2>&1; then
            # релиз с таким тегом уже есть (повторный запуск): обновляем файлы и описание, а не падаем
            gh release upload "$tag" out/* --clobber
            gh release edit "$tag" --title "corepanel ${{ inputs.version }}" --notes "$notes"
          else
            gh release create "$tag" out/* \
              --title "corepanel ${{ inputs.version }}" \
              --notes "$notes" \
              --target "${{ github.sha }}"
          fi

      - name: Убрать старые релизы (остаются 3 последних)
        if: ${{ inputs.release }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Новые сверху; всё, что ниже третьего релиза, удаляем вместе с тегами.
          gh release list --limit 100 --json createdAt,tagName \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' | while read -r t; do
            [ -n "$t" ] && gh release delete "$t" --yes --cleanup-tag
          done
