name: Сборка corepanel

# Запуск вручную: вкладка Actions → «Сборка corepanel» → Run workflow
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия обычного релиза (например 0.1.82). Предварительные сборки — в workflow «Сборка corepanel (dev)»"
        required: true
        default: "0.1.86"
      release:
        description: "Создать GitHub Release с файлами"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка версии (только обычный релиз)
        run: |
          v="${{ inputs.version }}"
          if ! printf %s "$v" | grep -Eq '^[0-9]+(\.[0-9]+)+$'; then
            echo "Неверная версия «$v»: нужно вида 0.1.82. Предварительные (dev) собирает workflow «Сборка corepanel (dev)»." >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Проверка (vet и тесты)
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Сборка бинарников (8 архитектур)
        run: scripts/build.sh "${{ inputs.version }}"

      - name: Сборка пакетов .ipk (OpenWrt и Entware)
        run: scripts/mkipk.sh "${{ inputs.version }}"

      - name: Сборка пакетов .apk (OpenWrt 25.x)
        run: python3 -I scripts/mkapk.py "${{ inputs.version }}"

      - name: Проверка .apk настоящим apk (Alpine)
        continue-on-error: true
        run: |
          f=$(ls dist/apk/corepanel_*_amd64_openwrt.apk)
          docker run --rm -v "$PWD/dist/apk:/p:ro" alpine:3.22 sh -c \
            "apk add --allow-untrusted --no-scripts --initdb --root /tmp/r --no-network /p/$(basename "$f") && ls -l /tmp/r/usr/bin/corepanel /tmp/r/etc/init.d/corepanel && apk info --root /tmp/r -v"

      - name: Подготовка файлов и контрольные суммы
        run: |
          mkdir -p out
          cp dist/corepanel-linux-* out/
          cp dist/ipk/*.ipk out/
          cp dist/apk/*.apk out/
          cd out && sha256sum * > SHA256SUMS.txt && ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: corepanel-${{ inputs.version }}
          path: out/*
          retention-days: 30

      - name: GitHub Release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ inputs.version }}"
          notes="Бинарники: corepanel-linux-<arch>. Пакеты: corepanel_<версия>_<arch>_<openwrt|entware>.ipk. Какой выбрать — в README."
          if gh release view "$tag" >/dev/null 2>&1; then
            # релиз с таким тегом уже есть (повторный запуск): обновляем файлы и описание, а не падаем
            gh release upload "$tag" out/* --clobber
            gh release edit "$tag" --title "corepanel ${{ inputs.version }}" --notes "$notes" --prerelease=false
          else
            gh release create "$tag" out/* \
              --title "corepanel ${{ inputs.version }}" \
              --notes "$notes" \
              --target "${{ github.sha }}"
          fi

      - name: Убрать старые релизы (остаются 3 последних обычных; dev-релизы не трогаются)
        if: ${{ inputs.release }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Среди обычных релизов: новые сверху, всё ниже третьего удаляем вместе с тегами.
          gh release list --limit 100 --json createdAt,tagName,isPrerelease \
            --jq '[sort_by(.createdAt) | reverse | .[] | select(.isPrerelease == false)] | .[3:] | .[].tagName' | while read -r t; do
            [ -n "$t" ] && gh release delete "$t" --yes --cleanup-tag
          done
